    <radialGradient id="sky" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1d2346"/>
      <stop offset="0.6" stop-color="#0d1024"/>
      <stop offset="1" stop-color="#05060c"/>
    </radialGradient>
    <radialGradient id="moon" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#fff1c7"/>
      <stop offset="0.55" stop-color="#f1c45e"/>
